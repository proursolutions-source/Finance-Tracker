<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Privacy-first offline personal finance tracker for tracking income, expenses, budgets, and financial goals">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>MoneyFlow - Personal Finance Tracker</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  
  <!-- Tailwind CSS -->
  <link rel="stylesheet" href="/src/styles/main.css">
  
  <!-- Preconnect for CDN resources -->
  <link rel="preconnect" href="https://unpkg.com">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-white">
  
  <!-- Loading Screen -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900">
    <div class="text-center">
      <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-primary-500 mb-4"></div>
      <h2 class="text-2xl font-bold text-white mb-2">MoneyFlow</h2>
      <p class="text-slate-400">Loading your financial data...</p>
    </div>
  </div>
  
  <!-- App Container -->
  <div id="app" class="hidden">
    <!-- Navigation will be injected here -->
    <nav id="nav-container"></nav>
    
    <!-- Main Content -->
    <main id="main-content" class="container mx-auto p-4 pb-24 md:pb-4">
      <!-- Page content will be rendered here -->
    </main>
    
    <!-- Bottom Navigation (Mobile) -->
    <div id="bottom-nav" class="fixed bottom-0 left-0 right-0 md:hidden bg-slate-900/80 backdrop-blur-md border-t border-white/10">
      <!-- Mobile nav will be injected here -->
    </div>
  </div>
  
  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2" aria-live="polite"></div>
  
  <!-- Modal Container -->
  <div id="modal-container"></div>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Vite Entry Point -->
  <script type="module" src="/src/main.ts"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('✅ Service Worker registered:', reg.scope))
          .catch(err => console.error('❌ Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
